<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nomi · Flyer prototype</title>
<style>
  :root {
    /* Nomi brand v1.0: Harbor Navy, Signal Coral (accent only), Paper, Cleared Green (status), Slate */
    --navy: #0F2A3D;
    --coral: #FF5A36;
    --coral-press: #F2491F;
    --accent: #0F2A3D;
    --accent-press: #0A1F2E;
    --accent-tint: #E8EDF1;
    --accent-tint-2: #CDD7DF;
    --ink: #0F2A3D;
    --ink-2: #2B4357;
    --muted: #56677A;
    --faint: #7E8C9A;
    --line: #E3DDD2;
    --line-2: #EFEAE1;
    --bg: #F5F1EA;
    --desk: #E8E2D7;
    --card: #FFFFFF;
    --pass: #1F7A62;
    --pass-tint: #E3F0EB;
    --fail: #B3261E;
    --fail-tint: #FBEAE8;
    /* Lender brand (Harbor Lane) leads on every flyer; Nomi stays off collateral */
    --lender: #2B50D6;
    --lender-press: #2242B4;
    --lender-tint: #EEF2FD;
    --lender-tint-2: #DCE4FB;
    --r: 14px;
    font-family: Inter, "Inter Display", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--desk); min-height: 100vh; }
  button { font: inherit; color: inherit; }

  .app {
    max-width: 390px; margin: 0 auto; min-height: 100vh;
    background: var(--bg); display: flex; flex-direction: column;
    box-shadow: 0 0 0 1px rgba(0,0,0,.04), 0 10px 40px rgba(20,24,40,.08);
  }

  /* Top bar */
  .top { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 6px; }
  .back {
    display: inline-flex; align-items: center; gap: 4px; background: none; border: 0; padding: 6px 8px 6px 2px;
    color: var(--ink-2); font-size: 15px; cursor: pointer; border-radius: 8px;
  }
  .back:disabled { color: var(--faint); cursor: default; }
  .back svg { width: 18px; height: 18px; }
  .brand { display: flex; align-items: center; gap: 7px; font-weight: 700; font-size: 17px; letter-spacing: -.01em; }
  .brand svg { width: 22px; height: 22px; }
  .me { width: 30px; height: 30px; border-radius: 50%; background: var(--line); color: var(--ink-2);
    display: grid; place-items: center; font-size: 12px; font-weight: 600; }
  .top-side { width: 70px; display: flex; }
  .top-side.right { justify-content: flex-end; }

  /* Progress */
  .progress { padding: 8px 16px 4px; }
  .bars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .bar { height: 4px; border-radius: 4px; background: var(--line); transition: background .3s; }
  .bar.on { background: var(--accent); }
  .labels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 7px; }
  .labels span { font-size: 11.5px; color: var(--faint); font-weight: 500; }
  .labels span.on { color: var(--ink-2); }
  .labels span.cur { color: var(--accent); font-weight: 650; }

  main { flex: 1; padding: 14px 16px 0; display: flex; flex-direction: column; }
  h2 { font-size: 24px; line-height: 1.2; letter-spacing: -.02em; margin: 6px 0 6px; }
  .sub { color: var(--muted); font-size: 15px; line-height: 1.45; margin: 0 0 18px; }

  /* Fields */
  .field { margin-bottom: 22px; }
  .flabel { font-size: 13px; font-weight: 650; color: var(--ink-2); margin-bottom: 4px; display: flex; justify-content: space-between; }
  .fhint { font-size: 12.5px; color: var(--muted); margin: 0 0 9px; }
  .opts { display: flex; flex-direction: column; gap: 8px; }
  .opt {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 11px 13px; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .opt:hover { border-color: #CBD0D8; }
  .opt[aria-checked="true"] { border-color: var(--accent); background: var(--accent-tint); }
  .opt .radio { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid #C4C9D2; flex: none; display: grid; place-items: center; background: #fff; }
  .opt[aria-checked="true"] .radio { border-color: var(--accent); }
  .opt[aria-checked="true"] .radio::after { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
  .opt .otext { flex: 1; min-width: 0; }
  .opt .o1 { font-size: 15px; font-weight: 600; }
  .opt .o2 { font-size: 13px; color: var(--muted); margin-top: 1px; }
  .opt .oright { font-size: 12px; color: var(--muted); text-align: right; flex: none; }
  .chip { font-size: 11px; font-weight: 600; color: var(--ink-2); background: var(--line-2); border-radius: 99px; padding: 3px 8px; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--line-2); color: var(--ink-2); font-size: 12.5px; font-weight: 650; display: grid; place-items: center; flex: none; }

  .seg { display: grid; grid-template-columns: repeat(3, 1fr); background: #E9EBEF; border-radius: 11px; padding: 3px; gap: 3px; }
  .seg button { border: 0; background: transparent; padding: 9px 4px; border-radius: 9px; font-size: 14px; font-weight: 550; color: var(--ink-2); cursor: pointer; }
  .seg button[aria-checked="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 1px 6px rgba(0,0,0,.04); }

  /* Actions */
  .spacer { flex: 1; min-height: 8px; }
  .actions {
    position: sticky; bottom: 0; margin: 0 -16px; padding: 14px 16px 12px;
    background: linear-gradient(to bottom, rgba(246,247,249,0), var(--bg) 22%);
    display: flex; flex-direction: column; gap: 8px; z-index: 5;
  }
  .actions.static { position: static; background: none; padding-top: 18px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
    border: 0; border-radius: 12px; padding: 14px 16px; font-size: 16px; font-weight: 650; cursor: pointer;
    transition: background .15s, opacity .15s, transform .05s;
  }
  .btn:active:not(:disabled) { transform: scale(.99); }
  .btn svg { width: 18px; height: 18px; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: var(--accent-press); }
  .btn-primary:disabled { opacity: .4; cursor: default; }
  .btn-secondary { background: var(--card); color: var(--ink); border: 1.5px solid var(--line); padding: 12.5px 16px; font-weight: 600; font-size: 15px; }
  .btn-secondary:hover { border-color: #CBD0D8; }
  .btn-text { background: none; color: var(--muted); font-weight: 550; font-size: 15px; padding: 10px; }
  .btn-text:hover { color: var(--ink); }

  .note { text-align: center; font-size: 11.5px; color: var(--faint); padding: 6px 16px 18px; }

  /* Spinner */
  .spin { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--accent-tint-2); border-top-color: var(--accent); animation: spin .8s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Flyer generation skeleton */
  .gen {
    aspect-ratio: 8.5 / 11; background: var(--card); border-radius: 6px; border: 1px solid var(--line);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px;
  }
  .gen .spin { width: 28px; height: 28px; border-width: 3px; }
  .gen-msg { font-size: 14px; color: var(--ink-2); font-weight: 550; text-align: center; min-height: 20px; }
  .gen-steps { list-style: none; margin: 4px 0 0; padding: 0; font-size: 13px; color: var(--faint); display: flex; flex-direction: column; gap: 6px; }
  .gen-steps li.done { color: var(--muted); }
  .gen-steps li.done::before { content: "✓ "; color: var(--accent); }

  /* ---------- Flyer ---------- */
  .flyer-wrap { container-type: inline-size; position: relative; }
  .flyer {
    aspect-ratio: 8.5 / 11; background: #fff; overflow: hidden; display: flex; flex-direction: column;
    font-size: 2.7cqw; color: #14161B; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; border-radius: 4px;
    box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 28px rgba(20,24,40,.12);
    animation: rise .45s ease-out;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .fl-top { background: var(--lender); color: #fff; padding: 1.4em 2em; display: flex; align-items: center; justify-content: space-between; }
  .fl-brand { display: flex; align-items: center; gap: .65em; }
  .fl-brand svg { width: 2.7em; height: 2.7em; }
  .fl-co { font-size: 1.25em; font-weight: 750; letter-spacing: -.01em; line-height: 1.05; }
  .fl-co2 { font-size: .62em; letter-spacing: .24em; font-weight: 600; opacity: .85; margin-top: .25em; }
  .fl-pill { font-size: .66em; text-transform: uppercase; letter-spacing: .12em; font-weight: 650; border: 1px solid rgba(255,255,255,.55); border-radius: 99px; padding: .45em .9em; }
  .fl-hero { padding: 1.7em 2em .7em; }
  .fl-eyebrow { font-size: .72em; text-transform: uppercase; letter-spacing: .16em; color: var(--lender); font-weight: 750; }
  .fl-h { font-size: 2.15em; line-height: 1.06; font-weight: 800; letter-spacing: -.025em; margin: .3em 0 .35em; }
  .fl-s { font-size: 1em; line-height: 1.4; color: #4B5160; margin: 0; }
  .fl-rate { margin: .7em 2em .4em; background: var(--lender-tint); border-radius: .7em; padding: .85em 1.2em; display: flex; align-items: center; gap: 1.4em; }
  .fl-rcol { display: flex; flex-direction: column; }
  .fl-rnum { font-size: 2.3em; font-weight: 800; color: var(--lender); letter-spacing: -.03em; line-height: 1; }
  .fl-rlbl { font-size: .66em; text-transform: uppercase; letter-spacing: .12em; color: #5B6170; font-weight: 650; margin-top: .45em; }
  .fl-rdiv { width: 1px; align-self: stretch; background: var(--lender-tint-2); }
  .fl-rnote { font-size: .8em; color: #4B5160; line-height: 1.35; margin-left: auto; text-align: right; }
  .fl-points { list-style: none; margin: .9em 2em .2em; padding: 0; display: grid; gap: .45em; }
  .fl-points li { display: flex; align-items: center; gap: .6em; font-size: .98em; font-weight: 550; }
  .fl-points svg { width: 1.15em; height: 1.15em; flex: none; color: var(--lender); }
  .fl-grow { flex: 1; }
  .fl-lo { margin: 0 2em; padding: .9em 0 1em; border-top: 1px solid #E6E8EC; display: flex; align-items: center; gap: 1em; }
  .fl-photo { width: 4.1em; height: 4.1em; border-radius: 50%; background: #E7EAF0; overflow: hidden; flex: none; position: relative; }
  .fl-photo svg { width: 100%; height: 100%; display: block; }
  .fl-name { font-size: 1.15em; font-weight: 750; letter-spacing: -.01em; }
  .fl-title { font-size: .76em; color: #5B6170; margin-top: .1em; }
  .fl-contact { font-size: .78em; color: #2A2E37; margin-top: .35em; line-height: 1.45; }
  .fl-contact b { color: var(--lender); font-weight: 650; }
  .fl-foot { background: #F3F4F6; padding: .9em 2em 1.1em; display: flex; gap: .9em; align-items: flex-start; }
  .fl-eho { flex: none; display: flex; flex-direction: column; align-items: center; width: 3.2em; color: #3A3F4A; }
  .fl-eho svg { width: 2.3em; height: 2.3em; }
  .fl-eho span { font-size: .38em; text-align: center; font-weight: 700; letter-spacing: .04em; line-height: 1.2; margin-top: .3em; }
  .fl-legal { font-size: .53em; line-height: 1.42; color: #4B5160; margin: 0; }
  .fl-legal b { color: #2A2E37; }

  .stage { position: relative; }
  .badge {
    position: absolute; top: -10px; right: -6px; z-index: 3;
    display: inline-flex; align-items: center; gap: 6px; background: var(--pass); color: #fff;
    font-size: 12.5px; font-weight: 650; padding: 7px 11px 7px 9px; border-radius: 99px;
    box-shadow: 0 4px 14px rgba(22,131,74,.3);
  }
  .badge svg { width: 15px; height: 15px; }

  /* Headline picker */
  .hl-opt .o1 { font-size: 14.5px; line-height: 1.3; }

  /* ---------- Compliance ---------- */
  .passbar { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 11px 13px; font-size: 14px; font-weight: 600; margin-bottom: 12px; }
  .passbar .pmeta { margin-left: auto; font-size: 12.5px; color: var(--muted); font-weight: 500; }
  .passbar .ok { color: var(--pass); }
  .passbar .bad { color: var(--fail); }
  .checks { list-style: none; margin: 0; padding: 0; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
  .check { display: flex; gap: 12px; padding: 13px 14px; border-top: 1px solid var(--line-2); transition: background .25s; }
  .check:first-child { border-top: 0; }
  .check.running { background: #FAFBFD; }
  .check.fail { background: var(--fail-tint); }
  .ico { width: 22px; height: 22px; flex: none; display: grid; place-items: center; margin-top: 1px; }
  .ico .dot { width: 18px; height: 18px; border-radius: 50%; border: 1.5px dashed #C9CED6; }
  .ico .res { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: #fff; animation: pop .25s ease-out; }
  .ico .res svg { width: 13px; height: 13px; }
  .ico .res.pass { background: var(--pass); }
  .ico .res.fail { background: var(--fail); }
  @keyframes pop { from { transform: scale(.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .cname { font-size: 14.5px; font-weight: 600; line-height: 1.3; }
  .check.pending .cname { color: var(--muted); }
  .creason { font-size: 13px; color: var(--muted); line-height: 1.4; margin-top: 3px; }
  .check.fail .creason { color: var(--fail); }
  .check.running .creason { color: var(--faint); }

  .fix { margin-top: 12px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 13px 14px; animation: rise .35s ease-out; }
  .fix-h { display: flex; align-items: center; gap: 9px; font-size: 14.5px; font-weight: 650; }
  .fix-h .tag { font-size: 11px; font-weight: 650; color: var(--ink-2); background: var(--line-2); border-radius: 99px; padding: 3px 8px; margin-left: auto; }
  .diff { margin-top: 11px; display: grid; gap: 6px; }
  .drow { border-radius: 9px; padding: 9px 11px; font-size: 14px; display: flex; gap: 10px; align-items: baseline; }
  .drow .dl { font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em; font-weight: 700; width: 46px; flex: none; }
  .drow .dl { min-width: 78px; flex-shrink: 0; }
  .drow.before { background: var(--fail-tint); }
  .drow.before .dl { color: var(--fail); }
  .drow.before .dv { text-decoration: line-through; text-decoration-color: rgba(199,55,47,.5); color: #6B3330; }
  .drow.after { background: var(--pass-tint); }
  .drow.after .dl { color: var(--pass); }
  .drow.after .dv { color: #134D2F; font-weight: 600; }
  .fix p { font-size: 13px; color: var(--muted); margin: 10px 0 0; line-height: 1.45; }

  .audit { margin-top: 12px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 13px 14px 6px; animation: rise .35s ease-out; }
  .audit-h { display: flex; align-items: center; gap: 8px; font-size: 14.5px; font-weight: 650; margin-bottom: 6px; }
  .audit-h svg { width: 17px; height: 17px; color: var(--ink-2); }
  .audit-h .when { margin-left: auto; font-size: 12px; color: var(--muted); font-weight: 500; }
  .audit dl { margin: 0; }
  .arow { display: grid; grid-template-columns: 96px 1fr; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line-2); font-size: 13px; }
  .arow:first-child { border-top: 0; }
  .arow dt { color: var(--muted); }
  .arow dd { margin: 0; color: var(--ink); line-height: 1.4; word-break: break-word; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
  .ok-text { color: var(--pass); font-weight: 650; }

  /* ---------- Ready ---------- */
  .ready-hero { text-align: center; padding: 4px 6px 18px; }
  .ready-hero .bigcheck { width: 46px; height: 46px; border-radius: 50%; background: var(--pass); color: #fff; display: grid; place-items: center; margin: 2px auto 10px; animation: pop .3s ease-out; }
  .ready-hero .bigcheck svg { width: 24px; height: 24px; }
  .ready-hero h2 { margin: 0 0 6px; }
  .elapsed { font-size: 15px; color: var(--ink-2); margin: 0; }
  .elapsed b { font-variant-numeric: tabular-nums; }
  .usual { font-size: 13px; color: var(--faint); margin: 5px 0 0; }
  .tagcard { margin-top: 18px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 13px; display: flex; gap: 11px; align-items: flex-start; }
  .tagcard .t1 { font-size: 14px; font-weight: 600; }
  .tagcard .t2 { font-size: 13px; color: var(--muted); margin-top: 2px; line-height: 1.4; }
  .tagcard .t3 { font-size: 12px; color: var(--faint); margin-top: 5px; }
  .tagcard svg { width: 18px; height: 18px; color: var(--ink-2); flex: none; margin-top: 1px; }

  /* Toast */
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0;
    background: #1B1E25; color: #fff; padding: 11px 15px; border-radius: 11px; font-size: 14px;
    display: flex; align-items: center; gap: 9px; max-width: calc(100% - 32px); width: max-content;
    transition: opacity .2s, transform .2s; pointer-events: none; z-index: 50;
    box-shadow: 0 8px 26px rgba(0,0,0,.2);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast svg { width: 16px; height: 16px; flex: none; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }

  /* ---------- v2 additions ---------- */
  .viewtabs { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; margin: 2px 16px 4px; background: #E9EBEF; border-radius: 10px; padding: 3px; }
  .viewtabs button { border: 0; background: transparent; padding: 7px 4px; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--ink-2); cursor: pointer; }
  .viewtabs button[aria-selected="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }

  /* Chat */
  .chat { display: flex; flex-direction: column; gap: 10px; padding-bottom: 8px; }
  .msg { max-width: 88%; font-size: 14.5px; line-height: 1.45; padding: 10px 13px; border-radius: 16px; animation: rise .25s ease-out; }
  .msg.bot { background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 5px; align-self: flex-start; }
  .msg.mine { background: var(--accent); color: #fff; border-bottom-right-radius: 5px; align-self: flex-end; }
  .msg.bot b { font-weight: 650; }
  .who { font-size: 11.5px; color: var(--faint); font-weight: 600; margin: 2px 2px -4px; }
  .typing { display: inline-flex; gap: 4px; padding: 13px 14px; }
  .typing i { width: 6px; height: 6px; border-radius: 50%; background: #B9BFCA; animation: blink 1s infinite; }
  .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .3; } 40% { opacity: 1; } }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; align-self: flex-start; max-width: 100%; animation: rise .25s ease-out; }
  .qchip { border: 1.5px solid var(--accent-tint-2); background: var(--card); color: var(--accent); font-size: 13.5px; font-weight: 600; border-radius: 99px; padding: 7px 12px; cursor: pointer; }
  .qchip:hover { background: var(--accent-tint); }
  .facts { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .fact { font-size: 12px; font-weight: 600; background: var(--accent-tint); color: var(--accent-press); border-radius: 99px; padding: 3px 9px; }
  .pre { align-self: stretch; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 13px; animation: rise .3s ease-out; }
  .pre .fix-h { font-size: 14px; }
  .summary { align-self: stretch; background: var(--card); border: 1.5px solid var(--accent-tint-2); border-radius: var(--r); padding: 13px 14px; animation: rise .3s ease-out; }
  .summary h4 { margin: 0 0 8px; font-size: 14.5px; }
  .srow { display: grid; grid-template-columns: 92px 1fr; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line-2); font-size: 13.5px; }
  .srow:first-of-type { border-top: 0; }
  .srow span:first-child { color: var(--muted); }
  .composer { position: sticky; bottom: 0; margin: 0 -16px; padding: 10px 16px 10px; background: linear-gradient(to bottom, rgba(246,247,249,0), var(--bg) 18%); z-index: 6; }
  .composer form { display: flex; gap: 8px; background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 6px 6px 6px 12px; align-items: flex-end; }
  .composer form:focus-within { border-color: var(--accent); }

  .send { width: 36px; height: 36px; border-radius: 10px; border: 0; background: var(--accent); color: #fff; display: grid; place-items: center; cursor: pointer; flex: none; }

  /* Editor */

  .live .pmeta { margin-left: auto; font-size: 12px; color: var(--muted); font-weight: 500; }
  .live.bad { border-color: #F1B9B5; background: var(--fail-tint); }
  .live .ico .res { width: 20px; height: 20px; }
  .livelist { list-style: none; margin: -4px 0 12px; padding: 0; background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }

  .livelist li:first-child { border-top: 0; }

  .livelist .ico .res { width: 18px; height: 18px; }
  .livelist .ico .res svg { width: 11px; height: 11px; }

  .livelist li.fail { background: var(--fail-tint); }

  .fixbtn { margin-top: 7px; border: 0; background: var(--fail); color: #fff; font-size: 12.5px; font-weight: 650; border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  .edit { margin-top: 18px; display: grid; gap: 14px; }
  .tinput { width: 100%; border: 1.5px solid var(--line); border-radius: 11px; padding: 10px 12px; font: inherit; font-size: 15px; background: var(--card); color: var(--ink); resize: vertical; }
  .tinput:focus { outline: 0; border-color: var(--accent); }
  .count { font-size: 11.5px; color: var(--faint); font-weight: 500; }
  .count.over { color: var(--fail); }
  .toggle { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 11px 13px; cursor: pointer; width: 100%; text-align: left; }
  .toggle .otext { flex: 1; }
  .toggle .o1 { font-size: 14.5px; font-weight: 600; }
  .toggle .o2 { font-size: 12.5px; color: var(--muted); margin-top: 2px; line-height: 1.35; }
  .sw { width: 40px; height: 24px; border-radius: 99px; background: #D5D9E0; position: relative; flex: none; transition: background .2s; }
  .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: left .2s; }
  .toggle[aria-checked="true"] .sw { background: var(--accent); }
  .toggle[aria-checked="true"] .sw::after { left: 19px; }
  .inline-note { font-size: 12.5px; color: var(--muted); background: var(--accent-tint); border-radius: 10px; padding: 9px 11px; line-height: 1.4; }

  /* Flyer extras */
  .fl-co-strip { background: var(--lender-tint); color: var(--lender-press); font-size: .78em; font-weight: 650; padding: .55em 2em; display: flex; align-items: center; gap: .6em; }
  .fl-co-strip .mk { width: 1.9em; height: 1.9em; border-radius: 50%; background: #fff; color: var(--lender); display: grid; place-items: center; font-size: .8em; font-weight: 800; border: 1px solid var(--lender-tint-2); }
  .fl-cta { margin: .8em 2em .2em; border: 1.5px solid var(--lender-tint-2); border-radius: .7em; padding: .6em 1em; font-size: .9em; font-weight: 650; color: var(--lender-press); }

  /* Lender view */
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; }
  .kpi .kv { font-size: 22px; font-weight: 750; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .kpi .kl { font-size: 12px; color: var(--muted); line-height: 1.35; margin-top: 2px; }
  .kpi .kb { font-size: 11.5px; color: var(--faint); margin-top: 5px; }
  .kpi.wide { grid-column: 1 / -1; }
  .meter { height: 6px; border-radius: 6px; background: var(--line); margin-top: 8px; position: relative; overflow: hidden; }
  .meter i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 6px; }
  .meter b { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink-2); }
  .filters { display: flex; gap: 6px; margin: 4px 0 10px; flex-wrap: wrap; }
  .filters button { border: 1.5px solid var(--line); background: var(--card); border-radius: 99px; padding: 6px 11px; font-size: 13px; font-weight: 600; color: var(--ink-2); cursor: pointer; }
  .filters button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-tint); }
  .assets { display: flex; flex-direction: column; gap: 8px; }
  .asset { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .asset.new { border-color: var(--accent); }
  .arow-btn { width: 100%; border: 0; background: none; text-align: left; padding: 11px 12px; cursor: pointer; display: flex; gap: 10px; align-items: flex-start; }
  .arow-btn .a1 { font-size: 14px; font-weight: 600; }
  .arow-btn .a2 { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .arow-btn .a3 { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
  .pill { font-size: 11px; font-weight: 650; border-radius: 99px; padding: 2px 8px; background: var(--line-2); color: var(--ink-2); }
  .pill.ok { background: var(--pass-tint); color: var(--pass); }
  .pill.acc { background: var(--accent-tint); color: var(--accent-press); }
  .arow-btn .el { margin-left: auto; text-align: right; font-size: 12.5px; color: var(--muted); flex: none; }
  .arow-btn .el b { display: block; color: var(--ink); font-size: 14px; font-variant-numeric: tabular-nums; }
  .asset .audit { margin: 0 10px 10px; animation: none; }
  .section-h { font-size: 13px; font-weight: 700; color: var(--ink-2); margin: 6px 2px 8px; text-transform: uppercase; letter-spacing: .06em; }
  .empty { font-size: 13px; color: var(--muted); padding: 14px; text-align: center; }

  /* ---------- Nomi brand v1.0 ---------- */
  h2 { font-weight: 600; letter-spacing: -.01em; font-family: "Inter Display", Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .brand .lockup { height: 26px; width: auto; display: block; }
  .tagline { font-size: 10.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); text-align: center; margin-top: 3px; }
  .labels span, .flabel, .section-h, .srow span:first-child, .arow dt { letter-spacing: .12em; text-transform: uppercase; font-size: 10.5px; font-weight: 600; }
  .flabel { color: var(--muted); }
  .srow { align-items: baseline; }
  .arow { align-items: baseline; }
  /* One Signal Coral CTA per view, navy text (never coral text) */
  .btn-primary { background: var(--coral); color: var(--navy); }
  .btn-primary:hover:not(:disabled) { background: var(--coral-press); }
  .btn-primary:disabled { opacity: 1; background: var(--line); color: var(--faint); }
  .btn-secondary { border-color: var(--accent-tint-2); color: var(--navy); }
  .me { overflow: hidden; background: var(--accent-tint); color: var(--navy); }
  .me svg { width: 100%; height: 100%; display: block; }
  .msg.mine { background: var(--navy); }
  .qchip { color: var(--navy); border-color: var(--accent-tint-2); }
  .fact { color: var(--navy); }
  .badge { background: var(--pass); }
  .check.fail, .livelist li.fail { background: var(--fail-tint); }
  .brand-col { display: flex; flex-direction: column; align-items: center; }

  /* ---------- v4: more color, within the brand balance ---------- */
  .band { background: var(--navy); color: #fff; padding-bottom: 12px; border-radius: 0 0 22px 22px; position: relative; overflow: hidden; }
  .band::after { content: ""; position: absolute; right: -38px; top: -38px; width: 120px; height: 120px; border-radius: 50%; border: 14px solid rgba(255,255,255,.05); pointer-events: none; }
  .band .back { color: #D3DCE5; } .band .back:disabled { color: rgba(255,255,255,.28); }
  .band .tagline { color: #9FB0C1; }
  .band .me { background: rgba(255,255,255,.12); color: #fff; box-shadow: 0 0 0 2px rgba(255,255,255,.18); }
  .band .viewtabs { background: rgba(255,255,255,.09); }
  .band .viewtabs button { color: #C9D4DE; }
  .band .viewtabs button[aria-selected="true"] { background: #fff; color: var(--navy); }
  .band .bar { background: rgba(255,255,255,.16); }
  .band .bar.on { background: #fff; }
  .band .bar.cur { background: linear-gradient(90deg, #fff 82%, var(--coral) 82%); }
  .band .labels span { color: rgba(255,255,255,.4); }
  .band .labels span.on { color: #C9D4DE; }
  .band .labels span.cur { color: #fff; }
  .brand .lockup circle { transform-box: fill-box; transform-origin: center; }
  .brand.hop .lockup circle[fill="#FF5A36"] { animation: hop .7s cubic-bezier(.3,1.6,.5,1) 2; }
  @keyframes hop { 0%,100% { transform: translateY(0); } 40% { transform: translateY(-5px); } }
  main { padding-top: 18px; }
  .botrow { display: flex; gap: 8px; align-items: flex-end; max-width: 92%; align-self: flex-start; }
  .botrow .msg { max-width: none; }
  .nm { width: 28px; height: 28px; border-radius: 50%; background: #fff; border: 1px solid var(--line); flex: none; display: grid; place-items: center; }
  .nm svg { width: 15px; height: 16px; }
  .msg.bot { border-color: #E9E3D8; }
  .summary { border: 0; padding: 0; overflow: hidden; box-shadow: 0 1px 2px rgba(15,42,61,.06), 0 8px 24px rgba(15,42,61,.08); background: #fff; }
  .summary h4 { background: var(--navy); color: #fff; margin: 0; padding: 12px 14px; display: flex; align-items: center; gap: 8px; }
  .summary h4::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--coral); }
  .summary .sbody { padding: 8px 14px 14px; }
  .pre { border-left: 4px solid var(--navy); }
  .fact { background: #E1E9EF; }
  .ready-hero { background: var(--navy); color: #fff; border-radius: 18px; padding: 20px 16px 18px; margin-bottom: 18px; position: relative; overflow: hidden; }
  .ready-hero::after { content: ""; position: absolute; left: -30px; bottom: -50px; width: 130px; height: 130px; border-radius: 50%; border: 14px solid rgba(255,255,255,.05); }
  .ready-hero .elapsed { color: #E3EAF0; }
  .ready-hero .usual { color: #9FB0C1; }
  .ready-hero .pb { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 12.5px; font-weight: 600; background: rgba(255,255,255,.1); border-radius: 99px; padding: 5px 11px; color: #fff; }
  .ready-hero .pb i { width: 7px; height: 7px; border-radius: 50%; background: var(--coral); }
  .nudge { margin-top: 12px; background: #E1E9EF; border-radius: var(--r); padding: 13px 14px; display: flex; gap: 11px; }
  .nudge .nm { background: #fff; border: 0; }
  .nudge .n1 { font-size: 14px; line-height: 1.45; color: var(--navy); }
  .nudge button { margin-top: 9px; border: 0; background: var(--navy); color: #fff; font-size: 13px; font-weight: 600; border-radius: 9px; padding: 7px 12px; cursor: pointer; }
  .kpi.wide { background: var(--navy); color: #fff; border: 0; }
  .kpi.wide .kl { color: #D3DCE5; } .kpi.wide .kb { color: #9FB0C1; }
  .kpi.wide .meter { background: rgba(255,255,255,.15); height: 8px; }
  .kpi.wide .meter i { background: #fff; }
  .kpi.wide .meter b { background: var(--coral); width: 10px; height: 10px; border-radius: 50%; top: -1px; margin-left: -5px; }
  .kpi .kv { color: var(--navy); } .kpi.wide .kv { color: #fff; font-size: 30px; }
  .toggle[aria-checked="true"] { border-color: var(--accent-tint-2); background: #F3F6F8; }
  .live:not(.bad) { background: var(--pass-tint); border-color: #C9E2D8; }

  /* ---------- v6: chat look, bottom nav, tabs ---------- */
  .msg.bot { background: #E3EAF0; border: 0; color: var(--navy); }
  .msg.bot.typing i { background: #8FA3B5; }
  .msg.mine { background: var(--navy); color: #fff; }
  .merow { display: flex; gap: 8px; align-items: flex-end; max-width: 92%; align-self: flex-end; }
  .merow .msg { max-width: none; }
  .mav { width: 28px; height: 28px; border-radius: 50%; overflow: hidden; flex: none; background: var(--accent-tint); }
  .mav svg { width: 100%; height: 100%; display: block; }
  .nm { background: var(--navy); border: 0; }
  .nm svg path { stroke: #fff; }
  .msg.bot .fact { background: #fff; }
  .linkrow { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 8px; }
  .toast { bottom: 86px; }
  .linkbtn { border: 1.5px solid var(--accent-tint-2); background: #fff; color: var(--navy); font-size: 12.5px; font-weight: 600; border-radius: 99px; padding: 5px 10px; cursor: pointer; }
  .app { padding-bottom: 68px; }
  .tabbar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: min(390px, 100%); background: #fff; border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px 4px calc(8px + env(safe-area-inset-bottom)); z-index: 40; box-shadow: 0 -6px 20px rgba(15,42,61,.06); }
  .tabbar button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 5px 2px; font-size: 11px; font-weight: 600; color: var(--muted); cursor: pointer; position: relative; }
  .tabbar svg { width: 22px; height: 22px; }
  .tabbar button[aria-current="page"] { color: var(--navy); }
  .tabbar button[aria-current="page"]::after { content: ""; position: absolute; top: 1px; right: calc(50% - 16px); width: 6px; height: 6px; border-radius: 50%; background: var(--coral); }
  .composer, .actions { bottom: 68px; }
  .actions.static { bottom: auto; }
  .note { padding-bottom: 10px; }
  .card-list { display: flex; flex-direction: column; gap: 8px; }
  .prow { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; display: flex; gap: 11px; align-items: center; }
  .prow .o1 { font-size: 14.5px; font-weight: 600; } .prow .o2 { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .prow .right { margin-left: auto; text-align: right; font-size: 12px; color: var(--muted); }
  .prow .avatar { background: #E3EAF0; color: var(--navy); }
  .stylecard { background: #fff; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
  .stylecard .shead { background: var(--navy); color: #fff; padding: 14px; display: flex; gap: 12px; align-items: center; }
  .stylecard .shead .mav { width: 46px; height: 46px; }
  .stylecard .srow { padding: 9px 14px; }

  /* ---------- v7: flyer image, Reg Z strip, co-brand block ---------- */
  .fl-hero { padding-top: 1.1em; }
  .fl-h { font-size: 1.95em; }
  .fl-img { margin: 0 2em; height: 8.6em; border-radius: .6em; overflow: hidden; background: var(--lender-tint); }
  .fl-img svg { width: 100%; height: 100%; display: block; }
  .fl-points { margin-top: .7em; }
  .fl-rate { margin-top: .6em; }
  .fl-regz { margin: .5em 2em 0; display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--lender-tint-2); border-radius: .6em; overflow: hidden; }
  .fl-regz div { padding: .45em .6em; border-left: 1px solid var(--lender-tint-2); }
  .fl-regz div:first-child { border-left: 0; }
  .fl-regz b { display: block; font-size: .95em; font-weight: 750; color: #14161B; }
  .fl-regz span { font-size: .56em; text-transform: uppercase; letter-spacing: .1em; color: #5B6170; font-weight: 650; }
  .fl-cta { margin-top: .6em; }
  .fl-people { margin: 0 2em; padding: .8em 0 .9em; border-top: 1px solid #E6E8EC; display: grid; grid-template-columns: 1fr; gap: .9em; }
  .fl-people.two { grid-template-columns: 1fr 1fr; }
  .fl-person { display: flex; gap: .7em; align-items: center; min-width: 0; }
  .fl-people.two .fl-person + .fl-person { border-left: 1px solid #E6E8EC; padding-left: .9em; }
  .fl-people.two .fl-photo { width: 3.4em; height: 3.4em; }
  .fl-people.two .fl-name { font-size: 1em; }
  .fl-people.two .fl-title, .fl-people.two .fl-contact { font-size: .68em; }
  .fl-plogo { width: 3.4em; height: 3.4em; border-radius: .5em; background: #2F3A33; color: #fff; display: grid; place-items: center; font-weight: 800; font-size: .95em; flex: none; letter-spacing: .02em; }
  .fl-person > div:last-child { min-width: 0; overflow-wrap: anywhere; }
  .fl-co-strip { display: none; }

  .fl-top { padding: 1.1em 2em; }
  .fl-hero { padding: .9em 2em .4em; }
  .fl-h { font-size: 1.7em; margin: .25em 0 .3em; }
  .fl-s { font-size: .92em; }
  .fl-img { height: 6.4em; }
  .fl-rate { margin: .5em 2em 0; padding: .55em 1em; }
  .fl-rnum { font-size: 1.7em; }
  .fl-rlbl { margin-top: .3em; }
  .fl-regz { margin-top: .45em; }
  .fl-regz b { font-size: .88em; }
  .fl-points { margin: .55em 2em 0; gap: .3em; }
  .fl-points li { font-size: .88em; }
  .fl-cta { margin: .55em 2em 0; padding: .45em .9em; font-size: .82em; }
  .fl-people { padding: .6em 0 .7em; }

  /* v9: stock photos */
  .fl-img { height: 8.4em; background: #DDE1E8; }
  .fl-img.tall { height: 11.6em; }
  .fl-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photocard { display: flex; gap: 9px; background: #E3EAF0; border-radius: 16px; border-bottom-left-radius: 5px; padding: 11px 12px; margin-bottom: 12px; color: var(--navy); }
  .pc1 { font-size: 14px; line-height: 1.45; }
  .thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 6px; margin-top: 9px; }
  .thumb { border: 2px solid transparent; padding: 0; border-radius: 9px; overflow: hidden; cursor: pointer; background: #fff; position: relative; aspect-ratio: 2.8 / 1.6; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb.on { border-color: var(--navy); }
  .thumb span { position: absolute; left: 4px; bottom: 4px; background: var(--navy); color: #fff; font-size: 10px; font-weight: 650; border-radius: 99px; padding: 1px 6px; }
  .pcswitch { margin-top: 8px; border: 0; background: none; color: var(--navy); font-weight: 650; font-size: 13px; text-decoration: underline; padding: 0; cursor: pointer; }

  /* v10: photo frame matches each photo's own shape, so nothing is cropped */
  .fl-herorow { display: grid; grid-template-columns: 1fr 46%; gap: 1.1em; align-items: center; padding: 1.1em 2em .3em; }
  .fl-herorow .fl-hero { padding: 0; }
  .fl-herorow .fl-h { font-size: 1.55em; line-height: 1.08; }
  .fl-herorow .fl-s { font-size: .86em; }
  .fl-img, .fl-img.tall { height: auto; margin: 0; border-radius: .5em; background: none; }
  .fl-img img { width: 100%; height: 100%; object-fit: cover; }
  .thumb { aspect-ratio: 3 / 2; }
  .fl-herorow.wide { grid-template-columns: 1fr 56%; }

  .fa { border: 1.5px solid var(--accent-tint-2); background: #fff; color: var(--navy); border-radius: 10px; padding: 8px 4px; font-size: 12px; font-weight: 600; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; line-height: 1.2; }
  .fa svg { width: 17px; height: 17px; }
  .fa[aria-expanded="true"] { background: #E3EAF0; }
  .fa-sizes { padding: 0 10px 12px; display: flex; flex-wrap: wrap; gap: 6px; }
  .fa-note { width: 100%; font-size: 12.5px; color: var(--muted); }

  /* v14: My style */
  .edit { grid-template-columns: minmax(0, 1fr); }
  .urlbox input { width: 0; }

/* ---------- Dates ---------- */
const DAYS = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
const fmtDay = d => d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
function bizDaysUntil(d) { let n = 0; const c = new Date(TODAY); while (c < d) { c.setDate(c.getDate() + 1); if (c.getDay() % 6 !== 0) n++; } return n; }
function mkWhen(d, label) { return { date: d, label: `${label} (${fmtDay(d)})`, short: label, urgent: bizDaysUntil(d) <= 2 }; }
function parseWhen(t) {
  const add = n => { const d = new Date(TODAY); d.setDate(d.getDate() + n); return d; };
  if (/\b(yesterday|last week|last (mon|tues|wednes|thurs|fri|satur|sun)day)\b/.test(t)) return { past: true, word: t.match(/\b(yesterday|last week|last \w+day)\b/)[0] };
  if (/\b(today(?!['’]s)|tonight|asap|right away|this (morning|afternoon|evening)|now)\b/.test(t)) return mkWhen(add(0), 'Today');
  if (/\btomorrow\b/.test(t)) return mkWhen(add(1), 'Tomorrow');
  if (/\bnext week\b/.test(t)) { const d = add(((8 - TODAY.getDay()) % 7) || 7); return mkWhen(d, 'Next week'); }
  if (/\b(this week|end of (the )?week)\b/.test(t)) { const d = add((5 - TODAY.getDay() + 7) % 7); return mkWhen(d, 'This week'); }
  const md = t.match(/\b(1[0-2]|0?[1-9])\/([12]\d|3[01]|0?[1-9])\b/);
  if (md) { const d = new Date(TODAY.getFullYear(), +md[1] - 1, +md[2], 12); if (d < TODAY) return { past: true, word: md[0] }; return mkWhen(d, md[0]); }
  for (let i = 0; i < 7; i++) {
    const re = new RegExp('\\b(' + DAYS[i] + '|' + DAYS[i].slice(0, 3) + ')\\b');
    if (re.test(t)) { let n = (i - TODAY.getDay() + 7) % 7; const d = add(n); const nm = DAYS[i][0].toUpperCase() + DAYS[i].slice(1); return mkWhen(d, n === 0 ? 'Today' : nm); }
  }
  return null;
}

/* ---------- Brief parser ---------- */
const NOT_NAMES = new Set(['HomeStart', 'Saturday', 'Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Today', 'Tomorrow', 'Jumbo', 'Builder', 'Harbor', 'Lane', 'Nomi', 'Open', 'Just', 'Need', 'Can', 'Please', 'Hi', 'Hey', 'The', 'A', 'I', 'Make', 'Create', 'Send', 'Something', 'Flyer', 'FHA', 'VA', 'USDA', 'Yes', 'No']);
function parse(raw) {
  const text = raw.trim(), t = text.toLowerCase();
  const r = { text };
  if (!text) { r.empty = true; return r; }
  if (/^(reset|start over|restart)$/.test(t)) { r.reset = true; return r; }
  const p = PARTNERS.find(x => x.keys.some(k => new RegExp('\\b' + k + '\\b').test(t)));
  if (p) r.partner = p.id;
  else {
    const m = text.match(/\b(?:for|from|to)\s+([A-Z][a-z]+)\b/) || text.match(/^([A-Z][a-z]+)\s+(?:needs|wants|asked|is asking)\b/);
    if (m && !NOT_NAMES.has(m[1])) r.unknownName = m[1];
  }
  if (/home ?start|first[- ]time|starter home|3% down/.test(t)) r.program = 'start';
  else if (/jumbo|luxury|million|\$1m|high[- ]balance/.test(t)) r.program = 'jumbo';
  else if (/buy ?down|2-1|new construction|new build|builder/.test(t)) r.program = 'buydown';
  else { const u = t.match(/\b(va|usda|heloc|reverse|refi|refinance|arm|fha|dscr)\b/); if (u) r.programUnknown = u[1].toUpperCase(); }
  const w = parseWhen(t); if (w) { if (w.past) r.past = w.word; else r.when = w; }
  if (/open house/.test(t)) r.occasion = 'Open house';
  else if (/seminar|workshop|class|buyer event|homebuyer event/.test(t)) r.occasion = 'Buyer seminar';
  else if (/grand opening|model home|community event/.test(t)) r.occasion = 'Grand opening';
  else if (S.expect === 'occasion' && /\b(just|no|none|nothing|skip|send it|regular|general)\b/.test(t)) r.occasion = null;
  if (/\b(no rates?|without (the |a )?rates?|don'?t (show|include) (the |a )?rates?)\b/.test(t)) r.noRate = true;
  const rates = [...text.matchAll(RATE_IN_TEXT)].map(m => +m[1]).filter(n => n > 1 && n < 15);
  r.hasApr = /\bapr\b/.test(t);
  if (rates.length) r.rateNum = rates[0];
  if (!r.noRate && (rates.length || /today'?s rate|with (the |a )?rate|show (the |a )?rate|include (the |a )?rate|current rate/.test(t))) r.wantsRate = true;
  r.zeroDown = (text.match(ZERO_DOWN) || [])[0];
  r.trigger = (text.match(TRIGGER) || [])[0];
  r.prohibited = [];
  PROHIBITED.forEach(rule => { const m = text.match(rule.re); if (m && !r.prohibited.some(x => x.m.toLowerCase().includes(m[0].toLowerCase()))) r.prohibited.push({ m: m[0], rule }); rule.re.lastIndex = 0; });
  ZERO_DOWN.lastIndex = 0; TRIGGER.lastIndex = 0;
  return r;
}

function addAdj(a) { a.stage = a.stage || 'Before drafting'; S.adjust.push(a); return a; }

/* ---------- Chat engine ---------- */
const wait = ms => new Promise(r => setTimeout(r, ms));
function push(m) { S.msgs.push(m); if (S.view === 'lo' && S.step === 1) renderChat(); }
function dropChips() { S.msgs = S.msgs.filter(m => m.type !== 'chips' && m.type !== 'summary' && m.type !== 'starts'); }
async function botSay(html, delay = 550) {
  push({ type: 'typing' });
  await wait(delay);
  S.msgs = S.msgs.filter(m => m.type !== 'typing');
  push({ who: 'bot', html });
}

function fridayLift() { const d = new Date(); return d.getDay() === 5 && d.getHours() >= 16 && d.getHours() < 18 ? ' One quick flyer and the weekend is yours.' : ''; }
function greet() {
  S.msgs = [
    { who: 'bot', html: `Hi ${LO.first}, I’m Nomi. Tell me who’s asking and what they need. I’ll have something ready before your coffee cools.${fridayLift()}` },
    { type: 'starts', items: [
      { pid: 'je', when: 'Sat', title: 'Jordan’s open house', sub: 'HomeStart flyer, co-branded', text: 'Jordan needs a HomeStart flyer for his open house Saturday' },
      { pid: 'dw', when: 'This week', title: 'Dana’s grand opening', sub: 'Watch how I handle “lowest rates, guaranteed”', text: 'Something for Dana’s grand opening with the lowest rates, guaranteed' },
      { pid: 'pn', when: 'Tomorrow', title: 'Priya’s buyer seminar', sub: 'First-time buyers, with today’s rate', text: 'Priya needs a low down payment flyer for her first-time buyer seminar tomorrow, with today’s 6.375% rate' },
    ] },
  ];
}

async function send(text) {
  if (S.busy) return;
  dropChips();
  const r = parse(text);
  if (r.empty) { await botSay('Who’s it for, and what did they ask for? A sentence is plenty.'); return; }
  if (r.reset) { S = freshState(); greet(); render(); return; }
  if (/^\s*["“]?send me something[.!”"]*\s*$/i.test(text)) {
    S.busy = true; if (!S.startedAt) S.startedAt = Date.now();
    push({ who: 'me', html: esc(text) });
    await botSay('Say less. Who’s it for, and what did they ask for?', 500);
    push({ type: 'chips', items: [...chipPartners(), 'Add a new partner'] }); S.expect = 'partner';
    S.busy = false; render(); return;
  }
  S.busy = true;
  if (!S.startedAt) S.startedAt = Date.now();
  push({ who: 'me', html: esc(text) });
  const b = S.brief, facts = [];
  const expected = S.expect; S.expect = null;

  if (/^pick a different partner$/i.test(text.trim())) {
    const others = chipPartners().filter(n => n !== (partner() || {}).name);
    await botSay('Sure. Who’s it for instead?');
    push({ type: 'chips', items: [...others, 'Add a new partner'] }); S.expect = 'partner';
    S.busy = false; render(); return;
  }
  const addM = text.trim().match(/^add (?:a new partner|(.+?) as a new partner)$/i);
  if (addM) {
    if (addM[1]) { S.pendingName = addM[1]; await botSay(`Happy to. What’s ${esc(addM[1])}’s company? Add “builder” if they build homes.`); S.expect = 'newPartnerCo'; }
    else { await botSay('Happy to. Who should I add? Name and company is plenty, like “Alex Chen, Summit Realty.”'); S.expect = 'newPartner'; }
    S.busy = false; render(); return;
  }
  if (expected === 'newPartner' || expected === 'newPartnerCo') {
    let name, co;
    const notTag = x => !/^(a )?builder$/i.test(x.trim());
    if (expected === 'newPartnerCo') { name = S.pendingName; co = text.trim().split(/\s*,\s*/).filter(notTag).join(', '); }
    else { const parts = text.trim().split(/\s*(?:,| at | from | with )\s*/i); name = parts[0]; co = parts.slice(1).filter(notTag).join(', '); }
    co = co || 'Independent';
    name = name.replace(/\b\w/g, c => c.toUpperCase()); co = co.replace(/^\w/, c => c.toUpperCase());
    const type = /builder|homes\b|construction/i.test(text) ? 'Builder' : 'Realtor';
    const np = { id: 'np' + (++NP), name, co, type, keys: [name.split(' ')[0].toLowerCase(), ...(name.split(' ')[1] ? [name.split(' ')[1].toLowerCase()] : [])], isNew: true, refs: 0, funded: 0, added: 0, touch: 0, flyers: 0 };
    PARTNERS.push(np); S.pendingName = null;
    b.partner = np.id;
    await botSay(`Added <b>${esc(np.name)} · ${esc(np.co)}</b> to your partners. Anything I make for ${esc(np.name.split(' ')[0])} gets tagged, so referrals trace back.`);
    await nextStep({ prohibited: [] }, true);
    S.busy = false; render(); return;
  }

  if (r.partner && r.partner !== b.partner) { b.partner = r.partner; const p = partner(); facts.push(`${p.name} · ${p.co}`); }
  if (r.program && r.program !== b.program) { b.program = r.program; facts.push(prog().name); b.rateDone = false; }
  if (r.when) { b.when = r.when; facts.push(`Needed by ${fmtDay(r.when.date)}`); }
  if (r.occasion !== undefined) { b.occasion = r.occasion; facts.push(r.occasion ? r.occasion : 'No event'); }
  if (r.noRate) { b.showRate = false; b.noRate = true; b.rateReq = null; facts.push('No rate on the flyer'); }
  if (r.wantsRate) { b.showRate = true; b.rateReq = { num: r.rateNum ?? null, hasApr: r.hasApr, raw: r.rateNum != null ? r.rateNum + '%' : 'today’s rate' }; b.rateDone = false; facts.push('Show the rate'); }
  if (expected === 'confirmPast' && /\byes\b/i.test(text) && !b.when) { b.when = mkWhen(new Date(TODAY), 'Today'); facts.push('Needed today'); }

  const oos = (text.match(/\b(video|reels?|tiktok|email blast|newsletter|postcard|print ad|listing flyer|billboard)\b/i) || [])[0];
  if (oos) await botSay(`I can’t make ${esc(oos.toLowerCase())}s yet. I can make a flyer that pairs well with one, though.`.replace('videos yet', 'video yet').replace('reelss', 'reels'));
  if (facts.length) await botSay(`Got it.<div class="facts">${facts.map(f => `<span class="fact">${esc(f)}</span>`).join('')}</div>`);

  // Compliance pre-check on the request itself
  for (const x of r.prohibited) {
    const a = addAdj({ rule: 'Rule 5', title: 'Misleading claim removed', before: x.m, after: x.rule.rep, why: x.rule.why });
    await preCard(a);
  }
  if (r.zeroDown) {
    const after = S.brief.showRate && prog() ? prog().downText : 'a low down payment';
    const a = addAdj({ rule: 'Rule 4', title: 'Down-payment claim corrected', before: r.zeroDown, after, why: 'None of Harbor Lane’s pilot programs offer zero down, so the flyer says what is true. The exact minimum appears only with the rate and payment example.' });
    await preCard(a);
  }
  if (r.trigger && !S.brief.showRate) {
    const a = addAdj({ rule: 'Rule 4', title: 'Kept general', before: r.trigger, after: 'a low down payment', why: `“${r.trigger}” is a trigger term: a specific down payment or payment has to come with the rate, APR and a payment example. You didn’t ask for a rate, so I kept the flyer about the program’s benefits. Say “add today’s rate” and I’ll show the numbers together.` });
    await preCard(a);
  } else if (r.trigger) {
    const a = addAdj({ rule: 'Rule 4', title: 'Payment example added', before: r.trigger, after: 'rate, APR, down payment, loan amount and monthly payment shown together', why: `“${r.trigger}” is a trigger term, so the rate, APR and payment example go with it on the flyer.` });
    await preCard(a);
  }

  await nextStep(r, facts.length > 0 || r.prohibited.length || r.zeroDown || r.trigger);
  S.busy = false;
  render();
}

async function preCard(a) {
  push({ type: 'typing' }); await wait(450);
  S.msgs = S.msgs.filter(m => m.type !== 'typing');
  push({ type: 'pre', a });
}

async function nextStep(r, understoodSomething) {
  const b = S.brief, p = partner();
  const first = p ? p.name.split(' ')[0] : 'them';
  if (!b.partner && r.unknownName) {
    S.asked++; S.expect = 'partner';
    S.pendingName = r.unknownName;
    await botSay(`I don’t see <b>${esc(r.unknownName)}</b> in your partners yet. Want me to add them, or is this for someone you already work with?`);
    push({ type: 'chips', items: [`Add ${r.unknownName} as a new partner`, ...chipPartners()] }); return;
  }
  if (!b.program && r.programUnknown) {
    S.asked++; S.expect = 'program';
    await botSay(`The pilot makes product flyers for three Harbor Lane programs, and <b>${esc(r.programUnknown)}</b> isn’t one of them yet. Which one fits?`);
    push({ type: 'chips', items: PROGRAMS.map(x => x.name) }); return;
  }
  if (r.past && !b.when) {
    S.asked++; S.expect = 'confirmPast';
    await botSay(`“${esc(r.past)}” has already passed. When does ${esc(first)} need it?`);
    push({ type: 'chips', items: ['Yes, today', 'Tomorrow', 'This week'] }); return;
  }
  if (!understoodSomething && !r.unknownName && !r.programUnknown && !r.past) {
    await botSay('I didn’t catch a partner, program or date in that. Want to try it like a text?', 450);
  }
  if (!b.partner) { S.asked++; S.expect = 'partner'; await botSay(understoodSomething ? 'Who’s it for?' : 'Who’s it for, and what did they ask for? A sentence is plenty.'); push({ type: 'chips', items: [...chipPartners(), 'Add a new partner'] }); return; }
  if (!b.program) { S.asked++; S.expect = 'program'; await botSay(`Which program should the flyer feature for ${esc(first)}?`); push({ type: 'chips', items: PROGRAMS.map(x => x.name) }); return; }
  if (!b.when) { S.asked++; S.expect = 'when'; await botSay(`When does ${esc(first)} need it?`); push({ type: 'chips', items: ['Today', 'Tomorrow', 'This week'] }); return; }
  if (b.occasion === undefined && S.asked < 3) {
    S.asked++; S.expect = 'occasion';
    await botSay(`Is this for something on ${esc(first)}’s calendar? I’ll add a line for it.`);
    const opts = p.type === 'Builder' ? ['Grand opening', 'Open house'] : ['Open house', 'Buyer seminar'];
    push({ type: 'chips', items: [...opts, `Just send it to ${first}`] }); return;
  }
  if (b.occasion === undefined) b.occasion = null;

  // Rate handling, once the program is known
  if (b.showRate && b.rateReq && !b.rateDone) {
    const pr = prog(), q = b.rateReq;
    b.rateDone = true;
    if (q.num != null && Math.abs(q.num - pr.rate) > 0.0005) {
      await preCard(addAdj({ rule: 'Rule 3', title: 'Rate replaced with today’s rate sheet', before: `${q.num}%`, after: `${pct(pr.rate)} rate · ${pct(pr.apr)} APR`, why: `${q.num}% isn’t on today’s ${pr.name} rate sheet. Nomi never invents rates: it uses the sheet and always shows the APR beside the rate.` }));
    } else if (!q.hasApr) {
      await preCard(addAdj({ rule: 'Rule 3', title: 'APR added beside the rate', before: `Show ${q.num != null ? q.num + '%' : 'today’s'} rate`, after: `${pct(pr.rate)} rate · ${pct(pr.apr)} APR`, why: 'Any advertised rate needs its APR beside it, at the same size, so the flyer is drafted that way from the start.' }));
    }
  }
  push({ type: 'summary' });
}

function curCopy() {
  const p = prog(), h = hl(p)[S.hl];
  return { h: S.hlText ?? h.h, s: S.subText ?? h.s };
}
function ctaText() {
  const b = S.brief, d = b.when ? fmtDay(b.when.date) : '';
  const who = S.cobrand && partner() ? `${partner().name.split(' ')[0]} and ${LO.first}` : LO.first;
  if (b.occasion === 'Open house') return `See ${who} at the open house · ${d}`;
  if (b.occasion === 'Buyer seminar') return `Join ${who} at the homebuyer seminar · ${d}`;
  if (b.occasion === 'Grand opening') return `Meet ${who} at the grand opening · ${d}`;
  return `Questions? ${STYLE.signoff}`;
}

function liveChecks() {
  const p = prog(), c = curCopy(), txt = `${c.h} ${c.s}`, pt = partner();
  const res = [
    { ok: true, r: `Found “${LO.name}, NMLS #${LO.nmls}” with her phone and email.` },
    { ok: true, r: `Footer shows ${CO.name} NMLS #${CO.nmls} and the Equal Housing Opportunity logo.` },
  ];
  RATE_IN_TEXT.lastIndex = 0;
  const rm = txt.match(RATE_IN_TEXT); RATE_IN_TEXT.lastIndex = 0;
  res.push(rm ? { ok: false, r: `“${rm[0].trim()}” in the copy is a rate without its APR and payment example. Rates come from today’s sheet, with the APR and payment beside them.`, fix: 'rate' }
    : { ok: true, r: S.brief.showRate ? `The ${pct(p.rate)} rate sits next to its ${pct(p.apr)} APR, with the loan amount (${fmtMoney(regz(p).loan)}), term and monthly payment beside it.` : 'No rate on this flyer, so no payment either. Most product flyers don’t need one.' });
  const zd = txt.match(ZERO_DOWN); ZERO_DOWN.lastIndex = 0;
  const tg = txt.match(TRIGGER); TRIGGER.lastIndex = 0;
  res.push(zd ? { ok: false, r: `“${zd[0]}” isn’t true for ${p.name}. The flyer has to state the real minimum.`, fix: 'zero' }
    : tg && !S.brief.showRate ? { ok: false, r: `“${tg[0].trim()}” is a trigger term. A specific down payment or payment needs the rate, APR and payment example beside it. Add today’s rate, or keep the wording general.`, fix: 'trigger' }
    : S.brief.showRate ? { ok: true, r: `The down payment (${fmtMoney(regz(p).down)}), loan amount (${fmtMoney(regz(p).loan)}), term, APR and monthly payment appear together with the rate, on the flyer and in the disclosure.` }
    : { ok: true, r: 'No rate, payment or down payment amount on this flyer, so no trigger-term disclosures are needed. It sticks to the program’s benefits and features.' });
  let bad = null;
  for (const rule of PROHIBITED) { const m = txt.match(rule.re); rule.re.lastIndex = 0; if (m) { bad = { m: m[0], rule }; break; } }
  res.push(bad ? { ok: false, r: `“${bad.m}”: ${bad.rule.why}`, fix: 'claim' } : { ok: true, r: 'No “guaranteed”, “lowest rate”, “no cost” or “pre-approved” language found.' });
  if (S.cobrand && !pt.lic) { res.push({ ok: false, r: `Co-branding needs ${pt.name.split(' ')[0]}’s license number and contact details. Add them in Partners, or send this one without co-branding.`, fix: 'cobrand' }); return res; }
  res.push(c.h.length > HL_MAX ? { ok: false, r: `Headline is ${c.h.length} characters; the layout fits ${HL_MAX}.`, fix: 'length' }
    : !c.h.trim() ? { ok: false, r: 'Headline is empty.', fix: 'length' }
    : { ok: true, r: S.cobrand ? `Harbor Lane brand leads; ${pt.co} appears as a co-brand line with a non-affiliation note.` : 'Harbor Lane’s logo, brand color and type styles are used.' });
  return res;
}
function applyFix(kind) {
  const p = prog();
  const fixText = s => {
    let out = s;
    if (kind === 'rate') out = out.replace(RATE_IN_TEXT, `${pct(p.rate)} (${pct(p.apr)} APR)`);
    if (kind === 'zero') out = out.replace(ZERO_DOWN, p.downText);
    if (kind === 'claim') PROHIBITED.forEach(rule => { out = out.replace(rule.re, rule.rep); rule.re.lastIndex = 0; });
    RATE_IN_TEXT.lastIndex = 0; ZERO_DOWN.lastIndex = 0;
    return out.replace(/\s{2,}/g, ' ').trim();
  };
  const c = curCopy();
  if (kind === 'trigger') {
    const gen = s => s.replace(TRIGGER, m => /down/i.test(m) ? 'a low down payment' : 'an affordable payment').replace(/^\w/, c => c.toUpperCase());
    const c0 = curCopy(), nh = gen(c0.h), ns = gen(c0.s); TRIGGER.lastIndex = 0;
    addAdj({ rule: 'Rule 4', title: 'Kept general', before: c0.h !== nh ? c0.h : c0.s, after: c0.h !== nh ? nh : ns, stage: 'In editor' });
    S.hlText = nh; S.subText = ns; const hi = $('#ed-h'), si = $('#ed-s'); if (hi) hi.value = nh; if (si) si.value = ns; refreshDraft(); toast('Kept it general. No rate needed.'); return;
  }
  if (kind === 'cobrand') { S.cobrand = false; const t = document.querySelector('[data-action=cobrand]'); if (t) t.setAttribute('aria-checked', false); refreshDraft(); toast('Co-branding off for this one.'); return; }
  if (kind === 'length') { const h = hl(p)[S.hl]; addAdj({ rule: 'Rule 6', title: 'Headline restored', before: c.h, after: h.h, stage: 'In editor' }); S.hlText = h.h; }
  else if (kind === 'claim') {
    const h = hl(p)[S.hl], bad = s => PROHIBITED.some(rule => { const m = rule.re.test(s); rule.re.lastIndex = 0; return m; });
    const nh = bad(c.h) ? h.h : c.h, ns = bad(c.s) ? h.s : c.s;
    addAdj({ rule: 'Rule 5', title: 'Edit corrected', before: c.h !== nh ? c.h : c.s, after: c.h !== nh ? nh : ns, stage: 'In editor' });
    S.hlText = nh; S.subText = ns;
  }
  else {
    const nh = fixText(c.h), ns = fixText(c.s);
    const rule = { rate: 'Rule 3', zero: 'Rule 4', claim: 'Rule 5' }[kind];
    addAdj({ rule, title: 'Edit corrected', before: c.h !== nh ? c.h : c.s, after: c.h !== nh ? nh : ns, stage: 'In editor' });
    S.hlText = nh; S.subText = ns;
  }
  const hi = $('#ed-h'), si = $('#ed-s');
  if (hi) hi.value = curCopy().h; if (si) si.value = curCopy().s;
  refreshDraft();
  toast('Fixed. I re-ran the checks and they pass.');
}

  if (e.target.id !== 'composer') return;
  e.preventDefault();
  const i = $('#input'), v = i.value; i.value = ''; i.style.height = '';
  send(v);
});
document.addEventListener('keydown', e => {
  if (e.target.id === 'input' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#composer').requestSubmit(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'input') { e.target.style.height = ''; e.target.style.height = Math.min(e.target.scrollHeight, 96) + 'px'; }
  if (e.target.id === 'p-q') {
    PV.q = e.target.value; const pos = e.target.selectionStart; render();
    const q = $('#p-q'); if (q) { q.focus(); q.setSelectionRange(pos, pos); }
  }
  if (e.target.id === 'st-team' || e.target.id === 'st-slug') {
    if (e.target.id === 'st-team') STYLE.team = e.target.value.slice(0, 40);
    else { const v = e.target.value.toLowerCase().replace(/[^a-z0-9-]/g, ''); if (v !== e.target.value) e.target.value = v; STYLE.slug = v.slice(0, 30); }
    const pv = $('#stylepreview'); if (pv) { pv.innerHTML = previewFlyer(); }
  }
  if (e.target.id === 'ed-h') { S.hlText = e.target.value; refreshDraft(); }
  if (e.target.id === 'ed-s') { S.subText = e.target.value; refreshDraft(); }
});

greet();
render();
</script>
</body>
</html>
